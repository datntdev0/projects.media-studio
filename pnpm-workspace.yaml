packages:
  - backend
  - frontend

allowBuilds:
  # Bakes $FIREBASE_WEBAPP_CONFIG into the package at install time. We pass the
  # config to `initializeApp` explicitly instead, and the shipped stub already
  # returns what an unset variable would produce, so it stays unrun.
  '@firebase/util': false
  '@parcel/watcher': false
  # Analytics postinstall inside swagger-ui-dist, which @nestjs/swagger pulls in.
  # Swagger UI serves fine without it, so the phone-home stays unrun.
  '@scarf/scarf': false
  '@tailwindcss/oxide': false
  'esbuild': false
  'maplibre-gl': false
  # Reached through firebase-tools. Its postinstall only prints a version-scheme
  # warning about its own dependents — nothing is generated by running it.
  'protobufjs': false
  # Optional native regex engine for superstatic, under firebase-tools. Only
  # installs on Linux, and superstatic falls back to the bundled re2js.
  're2': false
  'unrs-resolver': false
  'vue-demi': false
