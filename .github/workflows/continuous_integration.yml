name: continuous_integration

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Well above a healthy run, and well below the 6-hour default a hung step
    # would otherwise bill for.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: |
          set -o pipefail
          pnpm run test:cov 2>&1 | tee test.log

      # Runs after a failing suite too — a red run is when the numbers and the
      # failures are worth reading without opening the log.
      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('test.log') != '' }}
        run: node scripts/report-coverage.mjs test.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ !cancelled() && hashFiles('backend/coverage/index.html') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: backend/coverage
          retention-days: 7

      - name: Build
        run: pnpm run build

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the lockfile, which is what moves when Playwright's version does —
      # and the browser build is pinned to that version, so a stale entry cannot be
      # used against a newer one.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The browser binary only. `--with-deps` is deliberately absent: it shells out
      # to `sudo apt-get`, which on a hosted runner blocks with no timeout — behind
      # the dpkg lock `unattended-upgrades` holds after boot, or on a `needrestart`
      # prompt that never gets a TTY to answer it. Neither fails, so the job used to
      # sit there until GitHub's 6-hour ceiling.
      #
      # Nothing is lost by dropping it: ubuntu-latest ships Google Chrome, so every
      # shared library Playwright's Chromium links against is already on the image.
      # A missing one would now be a launch error naming it, not a hang.
      - name: Install Chromium
        timeout-minutes: 10
        run: pnpm --filter @media-studio/tests exec playwright install chromium

      # The emulators and Redis only. The scraping service is in the same file but
      # builds a stealth browser image, and nothing under test reaches it.
      - name: Start infrastructure
        run: docker compose -f _deploy/dockercompose.local.infrastructure.yml up -d --wait --wait-timeout 300 firebase redis

      # The examples are the local emulator setup, which is what the compose file
      # above brings up. Both are gitignored, so CI writes its own.
      - name: Configure the apps
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Start the apps
        run: pnpm dev > dev.log 2>&1 &

      - name: Wait for the apps
        run: |
          for _ in $(seq 60); do
            if curl -sf http://localhost:3001/health > /dev/null && curl -sf http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'The apps did not come up:'
          cat dev.log
          exit 1

      - name: End-to-end tests
        run: |
          set -o pipefail
          pnpm run test:e2e 2>&1 | tee e2e.log

      - name: Report the end-to-end run
        if: ${{ !cancelled() && hashFiles('e2e.log') != '' }}
        run: |
          {
            echo '## End-to-end tests'
            echo '```'
            cat e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The per-test lines are in the summary above; this is the trace and the
      # failure screenshots behind them.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
