name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-build-test:
    # node:sqlite and the packaged app's e2e launch (see e2e/fixtures.ts) are only exercised on Windows in dev.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # A transitive dep (@electron/rebuild -> @electron/node-gyp) resolves as a git+ssh
      # URL in the lockfile; the runner has no SSH key for github.com, so route it to https.
      - name: Force HTTPS for git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (electron-forge package)
        run: npm run package

      - name: E2E tests
        run: npx playwright test
