name: continuous_deployment

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # Pushing to the repository's own GitHub Packages registry needs nothing but this.
    permissions:
      contents: read
      packages: write

    strategy:
      # One red image should not stop the other two from being published.
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: scraping
            context: ./scraping
            dockerfile: scraping/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub expressions carry the full commit id and cannot slice it.
      - name: Read the short commit id
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.commit.outputs.short_sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Report the image
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo 'ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.commit.outputs.short_sha }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
