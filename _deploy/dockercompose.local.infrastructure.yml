# Local infrastructure for media-studio: the Firebase emulators and the scraping API.
# Start it from the repository root with `pnpm dev:infrastructure`.
# Everything is published on 127.0.0.1 only, on the same ports the apps already expect.
name: media-studio-local

services:
  firebase:
    build:
      context: ./firebase
    container_name: media-studio-firebase
    restart: unless-stopped
    # Import the previous session only when an export exists, so the first run starts clean.
    # Exports go to a subdirectory: firebase-tools clears the target by removing it, and a
    # mount point cannot be removed.
    command:
      - sh
      - -c
      - test -f /data/emulators/firebase-export-metadata.json && IMPORT=--import=/data/emulators; exec firebase emulators:start --config /config/firebase.json --project demo-media-studio --only auth,firestore,storage --export-on-exit=/data/emulators $$IMPORT
    environment:
      GOOGLE_CLOUD_PROJECT: demo-media-studio
    ports:
      - '127.0.0.1:4000:4000' # Emulator UI
      - '127.0.0.1:4400:4400' # Emulator hub (the UI talks to it)
      - '127.0.0.1:4500:4500' # Emulator logging stream
      - '127.0.0.1:8080:8080' # Firestore
      - '127.0.0.1:9099:9099' # Authentication
      - '127.0.0.1:9199:9199' # Storage
    volumes:
      - firebase-data:/data
    # The hub answers well before the emulators do, so probe all three of them.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://127.0.0.1:9099/ && curl -fsS -o /dev/null http://127.0.0.1:8080/ && curl -sS -o /dev/null http://127.0.0.1:9199/']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Give the emulators time to flush their export on shutdown.
    stop_grace_period: 30s
    networks: [media-studio]

  scraping:
    build:
      context: ../scraping
    container_name: media-studio-scraping
    restart: unless-stopped
    environment:
      SCRAPER_MAX_PAGES: '4'
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '127.0.0.1:8000:8000' # Scraping API (docs at /docs)
    # The browser writes to /dev/shm; the 64MB default makes it crash on bigger pages.
    shm_size: 1gb
    volumes:
      - scraping-data:/data
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health").read()']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [media-studio]

volumes:
  firebase-data:
  scraping-data:

networks:
  media-studio:
    driver: bridge
